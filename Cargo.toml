[package]
name = "hnl-ext-test"
version = "0.1.0"
edition = "2024"
description = "`hnl test` — the test runner as a dynamic `hnl` extension (ADR-0149)."
license = "MIT"
repository = "https://github.com/handl-lang/ext-test"
homepage = "https://handl-lang.github.io/docs/ext-test/"
documentation = "https://handl-lang.github.io/docs/ext-test/reference/"
readme = "README.md"
keywords = ["handl", "extension", "cli"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/ext-test (no crates.io).
publish = false

[lib]
# `cdylib` is the shipped artifact (`libhnl_ext_test.{so,dylib,dll}`);
# `rlib` keeps `cargo test` statically linked (ADR-0149 §Consequences).
crate-type = ["cdylib", "rlib"]

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-prelude = { git = "https://github.com/handl-lang/kit-prelude", branch = "main" }
handl-kit-pkg = { git = "https://github.com/handl-lang/kit-pkg", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine-test = { git = "https://github.com/handl-lang/engine-test", branch = "main" }
handl-plugin-ext-test = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

[profile.dev]
opt-level = 1
